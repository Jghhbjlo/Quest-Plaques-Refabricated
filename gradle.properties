# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
# Mappings are set in build.gradle (loom.officialMojangMappings()) so that this port can be
# compared one-to-one with the original 1.18.2 mod, which also used official mappings.
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.opxnhi

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Required: the 1.21.1 Fabric releases this port builds against.
# Modrinth maven coordinates use the version id so that the Fabric artifact is selected even when
# another loader shares the same version number.
#   forge-config-api-port v21.1.6-1.21.1-Fabric -> N5qzq0XV
#   advancement-plaques 1.6.8 (Fabric)        -> g0SNjiMq
#   iceberg 1.3.2 (Fabric)                    -> 7ITFAyW8
forge_config_api_version=N5qzq0XV
advancement_plaques_version=g0SNjiMq
iceberg_version=7ITFAyW8

# Optional FTB Quests integration (compile time only). Taken from the FTB Quests 1.21.1 build.
ftb_quests_version=2101.1.38
ftb_library_version=2101.1.39
architectury_version=13.0.11
